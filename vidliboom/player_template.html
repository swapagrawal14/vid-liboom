<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #14121f; --panel: rgba(20, 18, 31, .82); --ink: #fff; --muted: #b9b4d0;
    --accent: #ffcc33; --accent2: #ff6b8b; --btn: #fff; --btn-ink: #1d1a2e;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  button { font: inherit; cursor: pointer; border: 0; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top)); }
  header h1 { flex: 1; margin: 0; font-size: clamp(16px, 4vw, 22px); font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { background: rgba(255,255,255,.12); color: var(--ink); border-radius: 999px;
    padding: 9px 16px; font-size: 15px; font-weight: 700; min-height: 40px; }
  .pill:hover, .pill:focus-visible { background: rgba(255,255,255,.22); outline: none; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 10px; min-height: 0; }
  .stage { position: relative; width: 100%; max-width: 1100px; aspect-ratio: 16 / 9;
    max-height: calc(100dvh - 150px); background: #000; border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  @supports not (height: 100dvh) { .stage { max-height: calc(100vh - 150px); } }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 18px; gap: 14px;
    opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .layer.show { opacity: 1; pointer-events: auto; }
  .layer.dim { background: linear-gradient(to top, rgba(10,8,20,.92) 0%, rgba(10,8,20,.55) 55%, rgba(10,8,20,.25) 100%); }
  .layer.solid { background: radial-gradient(circle at 50% 35%, #2c2550, #14121f 70%); }

  .prompt { font-size: clamp(20px, 4.4vw, 38px); font-weight: 800; margin: 0;
    text-shadow: 0 3px 12px rgba(0,0,0,.6); }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; max-width: 820px; }
  .choice { position: relative; flex: 1 1 240px; max-width: 400px; min-height: 64px;
    background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 14px 26px;
    font-size: clamp(17px, 3.2vw, 24px); font-weight: 800; line-height: 1.2;
    box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
    transition: transform .12s ease, box-shadow .12s ease, background .2s; overflow: hidden; }
  .choice:hover, .choice:focus-visible { transform: translateY(-2px) scale(1.02); outline: none; background: var(--accent); }
  .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .choice .key { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: var(--btn-ink); color: var(--btn); font-size: 15px; margin-right: 10px; vertical-align: 2px; }
  .choice.auto { background: var(--accent); }
  .choice.auto::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: 100%;
    background: var(--accent2); transform-origin: left; animation: drain var(--secs, 10s) linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .timer { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; font-weight: 600; }
  .ring { width: 44px; height: 44px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: rgba(255,255,255,.18); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); font-size: 17px; }

  .big { font-size: clamp(26px, 6vw, 54px); font-weight: 900; margin: 0; }
  .sub { color: var(--muted); margin: 0; font-size: clamp(14px, 2.6vw, 18px); }
  .cta { background: var(--accent); color: var(--btn-ink); border-radius: 999px; padding: 16px 34px;
    font-size: clamp(18px, 3.4vw, 24px); font-weight: 900; min-height: 60px;
    box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .cta.ghost { background: rgba(255,255,255,.14); color: var(--ink); box-shadow: none; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .play-icon { width: 92px; height: 92px; border-radius: 50%; background: var(--accent); display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(255,204,51,.35); }
  .play-icon::before { content: ""; border-style: solid; border-width: 18px 0 18px 30px;
    border-color: transparent transparent transparent var(--btn-ink); margin-left: 8px; }

  .hud { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; opacity: 0; transition: opacity .3s; }
  .stage.playing:hover .hud, .stage.playing.touched .hud { opacity: 1; }
  .hud button { background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; }
  .flash { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6);
    padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  .flash.show { opacity: 1; }

  nav.crumbs { padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; align-items: center; min-height: 58px; }
  .crumb { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); flex: none; }
  .crumb.now { background: rgba(255,204,51,.2); color: var(--accent); font-weight: 800; }
  .crumb em { font-style: normal; color: var(--ink); opacity: .85; }
  .sep { color: var(--muted); opacity: .6; flex: none; }

  @media (max-width: 600px) {
    main { padding: 0; }
    .stage { border-radius: 0; max-height: none; }
    .choices { flex-direction: column; align-items: stretch; }
    .choice { max-width: none; flex: none; min-height: 56px; }
    .layer { gap: 10px; padding: 12px; }
    .layer.show.fit { position: fixed; z-index: 10; }  /* choices get the whole screen on small phones */
    .hud { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="title">__TITLE__</h1>
  <button class="pill" id="restartBtn" type="button" title="Shuru se (R)">&#8634; Restart</button>
</header>

<main>
  <div class="stage" id="stage">
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
    <div class="flash" id="flash"></div>
    <div class="hud"><button type="button" id="skipBtn">Skip &#9197;</button></div>

    <div class="layer solid show" id="startLayer">
      <button class="play-icon" id="startBtn" type="button" aria-label="Play"></button>
      <p class="big" id="startTitle"></p>
      <p class="sub" id="startSub"></p>
    </div>

    <div class="layer dim" id="choiceLayer" role="dialog" aria-live="polite">
      <p class="prompt" id="prompt"></p>
      <div class="choices" id="choices"></div>
      <div class="timer" id="timer">
        <div class="ring"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="bar" id="ringBar" cx="22" cy="22" r="18"/></svg><b id="secs"></b></div>
        <span id="timerText"></span>
      </div>
    </div>

    <div class="layer solid" id="missingLayer">
      <p class="big" id="missingName"></p>
      <p class="sub">(video abhi bana nahi hai)</p>
    </div>

    <div class="layer solid" id="endLayer">
      <p class="sub">The End</p>
      <p class="big" id="endName"></p>
      <p class="sub" id="endCount"></p>
      <div class="row">
        <button class="cta" id="againBtn" type="button">&#8634; Phir se dekho</button>
        <button class="cta ghost" id="backBtn" type="button">&#8630; Pichhla faisla badlo</button>
      </div>
    </div>
  </div>
</main>

<nav class="crumbs" id="crumbs" aria-label="Path"></nav>

<script>
(function () {
  "use strict";
  var STORY = /*__STORY_JSON__*/null;
  if (!STORY) { document.body.textContent = "No story data."; return; }

  var $ = function (id) { return document.getElementById(id); };
  var video = $("video"), stage = $("stage");
  var layers = ["startLayer", "choiceLayer", "missingLayer", "endLayer"].map($);
  var CIRC = 2 * Math.PI * 18;
  var state = { current: null, path: [], timer: null, deadline: 0, done: false, started: false };
  var STORE = "vidliboom-endings:" + STORY.title;

  function show(id) {
    layers.forEach(function (l) { l.classList.toggle("show", l.id === id); });
    $("choiceLayer").classList.toggle("fit", id === "choiceLayer");
  }
  function seg(id) { return STORY.segments[id]; }
  function endingIds() { return Object.keys(STORY.segments).filter(function (k) { return STORY.segments[k].ending; }); }
  function seenEndings() {
    try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) { return []; }
  }
  function markEnding(id) {
    try {
      var s = seenEndings();
      if (s.indexOf(id) < 0) { s.push(id); localStorage.setItem(STORE, JSON.stringify(s)); }
    } catch (e) { /* private mode */ }
  }
  function flash(text) {
    var f = $("flash"); f.textContent = text; f.classList.add("show");
    clearTimeout(flash.t); flash.t = setTimeout(function () { f.classList.remove("show"); }, 1600);
  }

  function renderCrumbs() {
    var nav = $("crumbs"); nav.textContent = "";
    state.path.forEach(function (step, i) {
      if (i > 0) {
        var sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "\u203A"; nav.appendChild(sep);
      }
      var c = document.createElement("span");
      c.className = "crumb" + (i === state.path.length - 1 ? " now" : "");
      c.textContent = seg(step.id).name;
      if (step.via) {
        var em = document.createElement("em"); em.textContent = "\u201C" + step.via + "\u201D";
        c.insertBefore(em, c.firstChild);
      }
      nav.appendChild(c);
    });
    nav.scrollLeft = nav.scrollWidth;
  }

  function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

  function play(id, via) {
    var s = seg(id);
    if (!s) { flash("Scene '" + id + "' nahi mila"); return; }
    stopTimer();
    state.current = id; state.done = false;
    state.path.push({ id: id, via: via || null });
    renderCrumbs();
    if (!s.video) {
      show("missingLayer"); $("missingName").textContent = s.name;
      video.removeAttribute("src"); video.load();
      setTimeout(function () { if (state.current === id && !state.done) finished(); }, 1800);
      return;
    }
    show(null);
    stage.classList.add("playing");
    video.src = s.video;
    var p = video.play();
    if (p && p.catch) p.catch(function () { /* autoplay blocked: user taps the video */ flash("Tap to play"); });
  }

  function finished() {
    if (state.done) return;
    state.done = true;
    stage.classList.remove("playing");
    var s = seg(state.current);
    if (s.choices && s.choices.length) return askChoice(s);
    if (s.next && seg(s.next)) return play(s.next);
    return ending(s);
  }

  function askChoice(s) {
    $("prompt").textContent = s.prompt || "Ab kya?";
    var box = $("choices"); box.textContent = "";
    var secs = STORY.countdown | 0;
    var autoIdx = STORY.autoPick === "random" ? Math.floor(Math.random() * s.choices.length) : 0;
    s.choices.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice" + (secs && i === autoIdx ? " auto" : "");
      b.style.setProperty("--secs", secs + "s");
      if (s.choices.length <= 9) {
        var k = document.createElement("span"); k.className = "key"; k.textContent = String(i + 1); b.appendChild(k);
      }
      b.appendChild(document.createTextNode(c.label));
      b.addEventListener("click", function () { choose(i); });
      box.appendChild(b);
    });
    show("choiceLayer");
    var bar = $("ringBar");
    bar.style.strokeDasharray = CIRC; bar.style.transition = "none"; bar.style.strokeDashoffset = 0;
    if (!secs) { $("timer").style.display = "none"; return; }
    $("timer").style.display = "";
    $("timerText").textContent = "\u201C" + s.choices[autoIdx].label + "\u201D apne aap chunega";
    state.deadline = Date.now() + secs * 1000;
    var tick = function () {
      if (document.hidden) return;
      var left = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
      $("secs").textContent = left;
      bar.style.transition = ""; bar.style.strokeDashoffset = CIRC * (1 - left / secs);
      if (left <= 0) { stopTimer(); choose(autoIdx, true); }
    };
    tick();
    state.timer = setInterval(tick, 250);
    var first = box.querySelector("button"); if (first && window.matchMedia("(hover: hover)").matches) first.focus({ preventScroll: true });
  }

  function choose(i, auto) {
    var s = seg(state.current);
    if (!s || !s.choices || !s.choices[i] || !state.done) return;
    stopTimer();
    if (auto) flash("Time up! \u201C" + s.choices[i].label + "\u201D");
    play(s.choices[i].goto, s.choices[i].label);
  }

  function ending(s) {
    markEnding(state.current);
    var all = endingIds(), seen = seenEndings().filter(function (e) { return all.indexOf(e) >= 0; });
    $("endName").textContent = s.name;
    $("endCount").textContent = all.length > 1 ? ("Endings mile: " + seen.length + " / " + all.length) : "";
    $("backBtn").style.display = lastChoiceIndex() >= 0 ? "" : "none";
    show("endLayer");
  }

  function lastChoiceIndex() {
    for (var i = state.path.length - 1; i >= 0; i--) {
      var s = seg(state.path[i].id);
      if (s.choices && s.choices.length && i < state.path.length - 1) return i;
    }
    return -1;
  }

  function backToChoice() {
    var i = lastChoiceIndex(); if (i < 0) return restart();
    stopTimer();
    state.path = state.path.slice(0, i + 1);
    state.current = state.path[i].id; state.done = true;
    renderCrumbs();
    var s = seg(state.current);
    if (s.video) { video.src = s.video; video.addEventListener("loadedmetadata", function seek() {
      video.removeEventListener("loadedmetadata", seek);
      try { video.currentTime = Math.max(0, video.duration - 0.05); } catch (e) {}
    }); }
    askChoice(s);
  }

  function restart() {
    stopTimer();
    video.pause();
    state.path = []; state.started = true;
    play(STORY.start);
  }

  function skip() {
    if (state.done || !state.current) return;
    if (isFinite(video.duration) && video.duration > 0.2) { video.currentTime = video.duration - 0.05; video.pause(); }
    finished();
  }

  video.addEventListener("ended", finished);
  video.addEventListener("error", function () {
    if (!video.getAttribute("src")) return;
    flash("Video load nahi hua"); finished();
  });
  video.addEventListener("click", function () {
    if (state.done) return;
    stage.classList.add("touched"); setTimeout(function () { stage.classList.remove("touched"); }, 2500);
    if (video.paused) video.play(); else video.pause();
  });

  $("startTitle").textContent = STORY.title;
  var nEnd = endingIds().length, nChoice = Object.keys(STORY.segments).filter(function (k) { return STORY.segments[k].choices.length; }).length;
  $("startSub").textContent = nChoice + " faisle \u00B7 " + nEnd + " endings \u00B7 tum chuno kahani";
  $("startBtn").addEventListener("click", restart);
  $("restartBtn").addEventListener("click", restart);
  $("againBtn").addEventListener("click", restart);
  $("backBtn").addEventListener("click", backToChoice);
  $("skipBtn").addEventListener("click", skip);

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^[1-9]$/.test(e.key) && $("choiceLayer").classList.contains("show")) { choose(+e.key - 1); e.preventDefault(); }
    else if (e.key === "r" || e.key === "R") restart();
    else if (e.key === " " && !state.started) { restart(); e.preventDefault(); }
    else if (e.key === "ArrowRight" && !state.done && state.started) skip();
  });
  document.addEventListener("visibilitychange", function () {
    if (!state.timer) return;
    if (document.hidden) { state.paused = state.deadline - Date.now(); }
    else if (state.paused != null) { state.deadline = Date.now() + state.paused; state.paused = null; }
  });
  show("startLayer");
})();
</script>
</body>
</html>
