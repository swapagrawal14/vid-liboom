[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-liboom"
version = "0.2.0"
description = "One script in, a whole cartoon episode out."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Swapnil Agrawal" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vidliboom = "vidliboom.__main__:main"

[tool.setuptools]
packages = ["vidliboom"]
